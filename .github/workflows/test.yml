name: Mystery AI Video Generator

on:
  workflow_dispatch:

  schedule:
    # Daily workflow start: 5:30 PM IST
    - cron: "30 17 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: telugu-mystery-daily
  cancel-in-progress: false

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # ============================================================
      # PYTHON DEPENDENCIES
      # ============================================================

      - name: Install Python dependencies
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ============================================================
      # FFMPEG
      # ============================================================

      - name: Install FFmpeg
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "FFmpeg:"
          ffmpeg -version | head -n 1

          echo "FFprobe:"
          ffprobe -version | head -n 1

      # ============================================================
      # CHECK PROJECT
      # ============================================================

      - name: Show project structure
        run: |
          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          find . -maxdepth 3 -type f \
            ! -path "./.git/*" \
            ! -path "./.github/*" \
            | sort

      # ============================================================
      # SHOW NEXT TOPIC
      # ============================================================

      - name: Show next topic
        run: |
          set -euo pipefail

          python - <<'PY'
          from src.topic_manager import get_next_topic

          topic = get_next_topic()

          print("=" * 70)
          print("NEXT TOPIC")
          print("=" * 70)

          if not topic:
              print("NO TOPICS LEFT")
              print("ALL TOPICS ARE COMPLETED")
          else:
              print("ID:", topic["id"])
              print("TITLE:", topic["title"])
              print("STATUS:", topic.get("status", ""))

          print("=" * 70)
          PY

      # ============================================================
      # RUN MYSTERY AI PIPELINE
      # ============================================================

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail

          python src/pipeline.py

      # ============================================================
      # VERIFY VIDEO + METADATA
      # ============================================================

      - name: Verify generated video and metadata
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          from pathlib import Path

          topics_file = Path("topics/topics.csv")

          if not topics_file.exists():
              raise SystemExit("ERROR: topics/topics.csv not found")

          with topics_file.open(
              "r",
              encoding="utf-8",
              newline=""
          ) as f:
              topics = list(csv.DictReader(f))

          candidates = []

          for topic in topics:

              topic_id = topic.get("id", "").strip()
              status = topic.get("status", "").strip().lower()

              if not topic_id:
                  continue

              if status == "completed":
                  continue

              video = Path("videos") / f"{topic_id}.mp4"
              metadata = Path("metadata") / f"{topic_id}.txt"

              if video.is_file() and metadata.is_file():
                  candidates.append(topic)

          candidates.sort(
              key=lambda t: int(t["id"].strip())
          )

          if not candidates:
              raise SystemExit(
                  "ERROR: No unfinished topic has both video and metadata"
              )

          topic = candidates[0]

          topic_id = topic["id"].strip()

          video = Path("videos") / f"{topic_id}.mp4"
          metadata = Path("metadata") / f"{topic_id}.txt"

          if video.stat().st_size <= 0:
              raise SystemExit(
                  f"ERROR: Video is empty: {video}"
              )

          if metadata.stat().st_size <= 0:
              raise SystemExit(
                  f"ERROR: Metadata is empty: {metadata}"
              )

          print("=" * 70)
          print("READY FOR YOUTUBE")
          print("=" * 70)
          print("TOPIC:", topic_id)
          print("TITLE:", topic["title"])
          print("VIDEO:", video)
          print("VIDEO SIZE:", video.stat().st_size, "bytes")
          print("METADATA:", metadata)
          print("METADATA SIZE:", metadata.stat().st_size, "bytes")
          print("=" * 70)
          PY

      # ============================================================
      # COMMIT GENERATED PIPELINE STATE
      # ============================================================

      - name: Commit pipeline state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            metadata \
            visuals/used_pexels_ids.txt \
            music/.last_used.txt

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
          else
            git commit -m "Daily mystery video build"
            git push
          fi

      # ============================================================
      # YOUTUBE UPLOAD
      # ============================================================

      - name: Upload video to YouTube
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -euo pipefail

          python src/youtube_upload.py

      # ============================================================
      # COMMIT YOUTUBE UPLOAD STATE
      # ============================================================

      - name: Commit YouTube upload state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            metadata/uploads

          if git diff --cached --quiet; then
            echo "No YouTube upload state changes to commit."
          else
            git commit -m "Record YouTube upload"
            git push
          fi

      # ============================================================
      # FINAL STATUS
      # ============================================================

      - name: Final status
        if: always()
        run: |
          echo "========================================"
          echo "TELUGU MYSTERY AI"
          echo "DAILY JOB FINISHED"
          echo "========================================"

          echo ""
          echo "Current IST:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Topics:"
          cat topics/topics.csv || true

          echo ""
          echo "Videos:"
          ls -lh videos || true

          echo ""
          echo "Upload records:"
          ls -lh metadata/uploads || true

          echo ""
          echo "========================================"
