name: Video Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # INSTALL PYTHON PACKAGES
      # ==================================================

      - name: Install Python
        run: |
          python -m pip install --upgrade pip

          pip install requests

          pip install edge-tts

          pip install google-api-python-client
          pip install google-auth-oauthlib
          pip install google-auth-httplib2


      # ==================================================
      # INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==================================================
      # GENERATE FRESH TELUGU VOICE
      # ==================================================

      - name: Generate Fresh Telugu Voice
        run: |
          echo "=========================================="
          echo "GENERATING FRESH TELUGU AUDIO"
          echo "=========================================="

          python src/voice.py

          echo "=========================================="
          echo "AUDIO FILES"
          echo "=========================================="

          ls -lh audio/

          test -f audio/003.mp3


      # ==================================================
      # BUILD MOVING VIDEO
      # ==================================================

      - name: Build Real Moving Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "=========================================="
          echo "BUILDING HIGH QUALITY MOVING VIDEO"
          echo "=========================================="

          python src/video.py


      # ==================================================
      # CHECK GENERATED VIDEO
      # ==================================================

      - name: Check generated video
        run: |
          echo "=========================================="
          echo "GENERATED VIDEO"
          echo "=========================================="

          ls -lh videos/

          test -f videos/003.mp4


      # ==================================================
      # CHECK VIDEO DETAILS
      # ==================================================

      - name: Verify Final Video
        run: |
          echo "=========================================="
          echo "FINAL VIDEO DETAILS"
          echo "=========================================="

          ffprobe \
            -v error \
            -show_entries format=duration \
            -show_entries stream=codec_name,width,height,codec_type \
            -of default=noprint_wrappers=1 \
            videos/003.mp4


      # ==================================================
      # UPLOAD TO YOUTUBE
      # ==================================================

      - name: Upload video to YouTube
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          echo "=========================================="
          echo "UPLOADING VIDEO TO YOUTUBE"
          echo "=========================================="

          python src/youtube_upload.py


      # ==================================================
      # FINAL MESSAGE
      # ==================================================

      - name: Do NOT commit large video
        run: |
          echo "=========================================="
          echo "PIPELINE COMPLETED"
          echo "=========================================="

          echo "Fresh Telugu audio generated."
          echo "High quality moving video created."
          echo "Video uploaded directly to YouTube."
          echo "MP4 will not be committed to GitHub."
