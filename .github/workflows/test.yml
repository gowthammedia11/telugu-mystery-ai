name: Mystery AI Video Generator

on:
  workflow_dispatch:

  schedule:
    # Build starts at 8:00 AM IST every day.
    # The video is uploaded to YouTube as PRIVATE with publishAt = 5:30 PM IST.
    # YouTube automatically makes it PUBLIC at exactly 5:30 PM IST.
    - cron: "0 8 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: telugu-mystery-daily
  cancel-in-progress: false

jobs:
  build-and-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Show next topic
        run: |
          python - <<'PY'
          from src.topic_manager import get_next_topic

          topic = get_next_topic()

          if not topic:
              print("NO TOPICS LEFT — ALL TOPICS ARE COMPLETED")
          else:
              print("NEXT TOPIC:", topic["id"], "-", topic["title"])
              print("STATUS:", topic.get("status", ""))
          PY

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python src/pipeline.py

      - name: Verify generated video and metadata
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          from pathlib import Path

          topics_file = Path("topics/topics.csv")
          if not topics_file.exists():
              raise SystemExit("topics/topics.csv not found")

          with topics_file.open("r", encoding="utf-8", newline="") as f:
              topics = list(csv.DictReader(f))

          candidates = [
              t for t in topics
              if t.get("status", "").strip().lower() != "completed"
              and (Path("videos") / f"{t['id'].strip()}.mp4").is_file()
              and (Path("metadata") / f"{t['id'].strip()}.txt").is_file()
          ]

          candidates.sort(key=lambda t: int(t["id"].strip()))

          if not candidates:
              raise SystemExit("No unfinished topic has both video and metadata")

          topic = candidates[0]
          topic_id = topic["id"].strip()

          video = Path("videos") / f"{topic_id}.mp4"
          metadata = Path("metadata") / f"{topic_id}.txt"

          if video.stat().st_size <= 0:
              raise SystemExit(f"Video is empty: {video}")
          if metadata.stat().st_size <= 0:
              raise SystemExit(f"Metadata is empty: {metadata}")

          print(f"READY TOPIC: {topic_id}")
          print(f"VIDEO: {video} ({video.stat().st_size} bytes)")
          print(f"METADATA: {metadata} ({metadata.stat().st_size} bytes)")
          PY

      - name: Commit pipeline state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            metadata \
            visuals/used_pexels_ids.txt \
            music/.last_used.txt

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
          else
            git commit -m "Daily mystery video build"
            git push
          fi

      - name: Schedule video for 5:30 PM IST
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -euo pipefail
          python src/youtube_upload.py

      - name: Commit YouTube schedule state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            metadata/uploads

          if git diff --cached --quiet; then
            echo "No YouTube schedule state changes to commit."
          else
            git commit -m "Schedule daily mystery video"
            git push
          fi

      - name: Final status
        if: always()
        run: |
          echo "========================================"
          echo "TELUGU MYSTERY AI - DAILY JOB"
          echo "========================================"
          echo "Current IST:"
          TZ=Asia/Kolkata date
          echo ""
          echo "Topics:"
          cat topics/topics.csv || true
          echo ""
          echo "Videos:"
          ls -lh videos || true
          echo ""
          echo "Upload records:"
          ls -lh metadata/uploads || true
          echo "========================================"
