name: Mystery AI Video Generator

on:
  workflow_dispatch:

  schedule:
    # 12:00 UTC = 5:30 PM IST
    - cron: "0 12 * * *"

permissions:
  contents: write

concurrency:
  group: mystery-ai-video
  cancel-in-progress: false

jobs:

  generate:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ======================================================
      # FFMPEG
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ======================================================
      # ENVIRONMENT
      # ======================================================

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}

        run: |
          python src/pipeline.py

      # ======================================================
      # STATUS
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "TOPICS"
          echo "========================================"
          cat topics/topics.csv || true

          echo "========================================"
          echo "RESEARCH"
          echo "========================================"
          ls -lh research || true

          echo "========================================"
          echo "SCRIPTS"
          echo "========================================"
          ls -lh scripts || true

          echo "========================================"
          echo "AUDIO"
          echo "========================================"
          ls -lh audio || true

          echo "========================================"
          echo "VIDEOS"
          echo "========================================"
          ls -lh videos || true

          echo "========================================"
          echo "METADATA"
          echo "========================================"
          ls -lh metadata || true

      # ======================================================
      # COMMIT STATE
      # ======================================================

      - name: Commit pipeline state
        if: success()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            metadata \
            visuals/used_pexels_ids.txt

          git diff --cached --quiet || git commit -m "Automated Mystery AI pipeline update"

      # ======================================================
      # PUSH
      # ======================================================

      - name: Push changes
        if: success()
        run: |
          git push
