name: Mystery AI Video Generator

on:
  workflow_dispatch:

  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:

  video:

    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==================================================
      # INSTALL PYTHON
      # ==================================================

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install edge-tts

          pip install google-api-python-client
          pip install google-auth-oauthlib
          pip install google-auth-httplib2


      # ==================================================
      # INSTALL FFMPEG
      # ==================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg


      # ==================================================
      # CHECK PROJECT
      # ==================================================

      - name: Check project files
        run: |
          echo "=========================================="
          echo "PROJECT STRUCTURE"
          echo "=========================================="

          find src -maxdepth 1 -type f | sort
          echo
          find topics -maxdepth 2 -type f | sort
          echo
          find music -maxdepth 3 -type f | sort || true


      # ==================================================
      # RUN ONE TOPIC PIPELINE
      # ==================================================

      - name: Run Master Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          python src/pipeline.py


      # ==================================================
      # SHOW TOPIC STATUS
      # ==================================================

      - name: Show Topic Status
        if: always()
        run: |
          echo "=========================================="
          echo "CURRENT TOPIC STATUS"
          echo "=========================================="

          cat topics/topics.csv


      # ==================================================
      # COMMIT RESEARCH / SCRIPT / METADATA / STATUS
      # ==================================================

      - name: Commit pipeline state
        if: always()
        run: |
          echo "=========================================="
          echo "COMMITTING PIPELINE STATE"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics/topics.csv
          git add research/ || true
          git add scripts/ || true
          git add metadata/ || true
          git add visuals/used_pexels_ids.txt || true

          git status

          git diff --cached --quiet || git commit -m "Update Mystery AI pipeline state"

          git push
