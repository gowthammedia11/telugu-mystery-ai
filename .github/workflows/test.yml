name: Telugu Mystery AI - Daily 5:30 PM Publish

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: telugu-mystery-daily
  cancel-in-progress: false

jobs:

  build-and-publish:

    runs-on: ubuntu-latest

    timeout-minutes: 480

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Show next topic
        run: |
          python - <<'PY'
          from src.topic_manager import get_next_topic

          topic = get_next_topic()

          if not topic:
              print("NO TOPICS LEFT — ALL TOPICS ARE COMPLETED")
          else:
              print("NEXT TOPIC:", topic["id"], "-", topic["title"])
              print("STATUS:", topic.get("status", ""))
          PY

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python src/pipeline.py

      - name: Verify long video and Short
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          from pathlib import Path

          topics_file = Path("topics/topics.csv")

          if not topics_file.exists():
              raise SystemExit("topics/topics.csv not found")

          with topics_file.open("r", encoding="utf-8", newline="") as f:
              topics = list(csv.DictReader(f))

          candidates = [
              t
              for t in topics
              if t.get("status", "").strip().lower() != "completed"
              and (Path("videos") / f"{t['id'].strip()}.mp4").is_file()
              and (Path("metadata") / f"{t['id'].strip()}.txt").is_file()
              and (Path("videos") / f"{t['id'].strip()}_short.mp4").is_file()
              and (Path("metadata") / f"{t['id'].strip()}_short.txt").is_file()
          ]

          candidates.sort(key=lambda t: int(t["id"].strip()))

          if not candidates:
              raise SystemExit(
                  "No unfinished topic has both long video and Short"
              )

          topic = candidates[0]
          topic_id = topic["id"].strip()

          files = [
              Path("videos") / f"{topic_id}.mp4",
              Path("metadata") / f"{topic_id}.txt",
              Path("videos") / f"{topic_id}_short.mp4",
              Path("metadata") / f"{topic_id}_short.txt",
              Path("audio") / f"{topic_id}.mp3",
              Path("audio") / f"{topic_id}_short.mp3",
              Path("scripts") / f"{topic_id}.txt",
              Path("scripts") / f"{topic_id}_short.txt",
          ]

          for file in files:
              if not file.is_file():
                  raise SystemExit(f"Missing file: {file}")

              if file.stat().st_size <= 0:
                  raise SystemExit(f"Empty file: {file}")

              print(f"READY: {file} ({file.stat().st_size} bytes)")

          print(f"READY TOPIC: {topic_id}")
          print(f"TITLE: {topic['title']}")
          PY

      - name: Commit generated pipeline state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            audio \
            metadata \
            visuals/used_pexels_ids.txt

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
          else
            git commit -m "Daily mystery video and short build"
            git push
          fi

      - name: Publish long video and Short
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -euo pipefail
          python src/youtube_upload.py

      - name: Commit YouTube upload state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            metadata/uploads

          if git diff --cached --quiet; then
            echo "No YouTube upload state changes to commit."
          else
            git commit -m "Upload daily mystery video and short"
            git push
          fi

      - name: Final status
        if: always()
        run: |
          echo "========================================"
          echo "TELUGU MYSTERY AI - DAILY JOB"
          echo "========================================"

          echo "Current IST:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Topics:"
          cat topics/topics.csv || true

          echo ""
          echo "Videos:"
          ls -lh videos || true

          echo ""
          echo "Shorts:"
          ls -lh videos/*_short.mp4 2>/dev/null || true

          echo ""
          echo "Upload records:"
          ls -lh metadata/uploads || true

          echo "========================================"
