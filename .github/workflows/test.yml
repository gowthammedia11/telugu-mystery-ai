name: Video Generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Build Real Moving Video
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python src/video.py

      - name: Check generated video
        run: |
          echo "Generated video:"
          ls -lh videos/
          test -f videos/003.mp4

      - name: Do NOT commit large video
        run: |
          echo "Video created successfully."
          echo "Video will be uploaded directly to YouTube."
          echo "MP4 will not be committed to GitHub."
