name: Test Automation

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: pip install requests edge-tts

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run Research
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/research.py

      - name: Generate Telugu Script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python src/script.py

      - name: Generate Telugu Voice
        run: python src/voice.py

      - name: Build Video
        run: python src/video.py

      - name: Save generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/ scripts/ audio/ videos/
          git diff --cached --quiet || git commit -m "Generate video assets"
          git push
