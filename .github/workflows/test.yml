name: Mystery AI Video Generator

on:
  workflow_dispatch:

  schedule:
    # 13:15 IST = 07:45 UTC
    # Build starts at 1:15 PM IST
    - cron: "45 7 * * *"

permissions:
  contents: write

concurrency:
  group: mystery-ai-video
  cancel-in-progress: false

jobs:

  generate-and-publish:

    runs-on: ubuntu-latest

    timeout-minutes: 360

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # INSTALL DEPENDENCIES
      # ======================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      # ======================================================
      # FFMPEG
      # ======================================================

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ======================================================
      # GENERATE VIDEO
      # ======================================================

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}

        run: |
          python src/pipeline.py

      # ======================================================
      # SHOW GENERATED FILES
      # ======================================================

      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "TOPICS"
          echo "========================================"
          cat topics/topics.csv || true

          echo "========================================"
          echo "RESEARCH"
          echo "========================================"
          ls -lh research || true

          echo "========================================"
          echo "SCRIPTS"
          echo "========================================"
          ls -lh scripts || true

          echo "========================================"
          echo "AUDIO"
          echo "========================================"
          ls -lh audio || true

          echo "========================================"
          echo "VIDEOS"
          echo "========================================"
          ls -lh videos || true

          echo "========================================"
          echo "METADATA"
          echo "========================================"
          ls -lh metadata || true

      # ======================================================
      # COMMIT PIPELINE STATE
      # ======================================================

      - name: Commit pipeline state
        if: success()
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            metadata \
            visuals/used_pexels_ids.txt

          git diff --cached --quiet || git commit -m "Automated Mystery AI pipeline update"

      # ======================================================
      # PUSH PIPELINE STATE
      # ======================================================

      - name: Push changes
        if: success()
        run: |
          git push

      # ======================================================
      # WAIT UNTIL 5:30 PM IST
      # ======================================================

      - name: Wait until 5:30 PM IST
        if: success()
        run: |

          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import time

          tz = ZoneInfo("Asia/Kolkata")

          now = datetime.now(tz)

          target = now.replace(
              hour=17,
              minute=30,
              second=0,
              microsecond=0
          )

          # If generation somehow finishes after 5:30 PM,
          # upload immediately instead of waiting until tomorrow.
          if now >= target:
              print("Current time is already 5:30 PM IST or later.")
              print("Proceeding to YouTube upload.")
          else:
              seconds = (target - now).total_seconds()

              print("Current IST time:", now.strftime("%Y-%m-%d %H:%M:%S"))
              print("Upload target:", target.strftime("%Y-%m-%d %H:%M:%S"))
              print(f"Waiting {int(seconds)} seconds until 5:30 PM IST...")

              time.sleep(seconds)

              print("5:30 PM IST reached.")
          PY

      # ======================================================
      # YOUTUBE PUBLIC UPLOAD
      # ======================================================

      - name: Upload video to YouTube
        if: success()
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}

        run: |
          python src/youtube_upload.py

      # ======================================================
      # FINAL STATUS
      # ======================================================

      - name: Final status
        if: always()
        run: |

          echo "========================================"
          echo "MYSTERY AI DAILY JOB COMPLETED"
          echo "========================================"

          echo "IST TIME:"
          TZ=Asia/Kolkata date

          echo "========================================"
          echo "VIDEOS"
          echo "========================================"
          ls -lh videos || true

          echo "========================================"
          echo "TOPICS"
          echo "========================================"
          cat topics/topics.csv || true

          echo "========================================"
          echo "DONE"
          echo "========================================"
