name: Telugu Mystery AI - Daily 5:30 PM Publish

on:
  workflow_dispatch:

  schedule:
    - cron: "30 17 * * *"
      timezone: "Asia/Kolkata"

permissions:
  contents: write

concurrency:
  group: telugu-mystery-daily
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 480

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            edge-tts \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib \
            google-auth-httplib2

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Show next topic
        run: |
          python - <<'PY'
          from src.topic_manager import get_next_topic

          topic = get_next_topic()

          if not topic:
              print("NO TOPICS LEFT - ALL TOPICS ARE COMPLETED")
          else:
              print("NEXT TOPIC:", topic["id"], "-", topic["title"])
              print("STATUS:", topic.get("status", ""))
          PY

      - name: Run Mystery AI Pipeline
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          python src/pipeline.py

      - name: Verify generated long and short videos
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import subprocess
          from pathlib import Path

          topics_file = Path("topics/topics.csv")

          if not topics_file.exists():
              raise SystemExit("topics/topics.csv not found")

          with topics_file.open("r", encoding="utf-8", newline="") as f:
              topics = list(csv.DictReader(f))

          candidates = [
              t
              for t in topics
              if t.get("status", "").strip().lower() != "completed"
              and (Path("videos") / f"{t['id'].strip()}.mp4").is_file()
              and (Path("videos") / f"{t['id'].strip()}_short.mp4").is_file()
              and (Path("metadata") / f"{t['id'].strip()}.txt").is_file()
              and (Path("metadata") / f"{t['id'].strip()}_short.txt").is_file()
          ]

          candidates.sort(
              key=lambda t: int(t["id"].strip())
          )

          if not candidates:
              raise SystemExit(
                  "No unfinished topic has both long and short outputs"
              )

          topic = candidates[0]
          topic_id = topic["id"].strip()

          long_video = Path("videos") / f"{topic_id}.mp4"
          short_video = Path("videos") / f"{topic_id}_short.mp4"
          long_metadata = Path("metadata") / f"{topic_id}.txt"
          short_metadata = Path("metadata") / f"{topic_id}_short.txt"

          for path in [
              long_video,
              short_video,
              long_metadata,
              short_metadata,
          ]:
              if not path.is_file():
                  raise SystemExit(f"Missing file: {path}")

              if path.stat().st_size <= 0:
                  raise SystemExit(f"Empty file: {path}")

          def probe(path):
              result = subprocess.run(
                  [
                      "ffprobe",
                      "-v",
                      "error",
                      "-show_entries",
                      "stream=width,height",
                      "-show_entries",
                      "format=duration",
                      "-of",
                      "json",
                      str(path),
                  ],
                  capture_output=True,
                  text=True,
                  check=True,
              )

              import json
              return json.loads(result.stdout)

          long_info = probe(long_video)
          short_info = probe(short_video)

          long_stream = next(
              (
                  s for s in long_info.get("streams", [])
                  if s.get("width") and s.get("height")
              ),
              None,
          )

          short_stream = next(
              (
                  s for s in short_info.get("streams", [])
                  if s.get("width") and s.get("height")
              ),
              None,
          )

          if not long_stream:
              raise SystemExit("Unable to read long video dimensions")

          if not short_stream:
              raise SystemExit("Unable to read short video dimensions")

          long_width = int(long_stream["width"])
          long_height = int(long_stream["height"])
          short_width = int(short_stream["width"])
          short_height = int(short_stream["height"])

          long_duration = float(
              long_info["format"]["duration"]
          )

          short_duration = float(
              short_info["format"]["duration"]
          )

          if long_width != 1920 or long_height != 1080:
              raise SystemExit(
                  f"Long video resolution is {long_width}x{long_height}, expected 1920x1080"
              )

          if short_width != 1080 or short_height != 1920:
              raise SystemExit(
                  f"Short video resolution is {short_width}x{short_height}, expected 1080x1920"
              )

          if short_duration < 45 or short_duration > 60:
              raise SystemExit(
                  f"Short duration is {short_duration:.2f}s, expected 45-60s"
              )

          print(f"READY TOPIC: {topic_id}")
          print(f"LONG VIDEO: {long_video}")
          print(f"LONG DURATION: {long_duration:.2f}s")
          print(f"SHORT VIDEO: {short_video}")
          print(f"SHORT DURATION: {short_duration:.2f}s")
          print(f"LONG METADATA: {long_metadata}")
          print(f"SHORT METADATA: {short_metadata}")
          PY

      - name: Commit pipeline state
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            topics/topics.csv \
            research \
            scripts \
            metadata

          if [ -f visuals/used_pexels_ids.txt ]; then
            git add visuals/used_pexels_ids.txt
          fi

          if git diff --cached --quiet; then
            echo "No repository state changes to commit."
          else
            git commit -m "Daily mystery video build"
            git push
          fi

      - name: Publish long video and Short
        env:
          YOUTUBE_TOKEN_B64: ${{ secrets.YOUTUBE_TOKEN_B64 }}
        run: |
          set -euo pipefail
          python src/youtube_upload.py

      - name: Commit YouTube upload state
        if: always()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add topics/topics.csv

          if [ -d metadata/uploads ]; then
            git add metadata/uploads
          fi

          if git diff --cached --quiet; then
            echo "No YouTube upload state changes to commit."
          else
            git commit -m "Save YouTube upload state"
            git push
          fi

      - name: Final status
        if: always()
        run: |
          echo "========================================"
          echo "TELUGU MYSTERY AI - DAILY JOB"
          echo "========================================"

          echo "Current IST:"
          TZ=Asia/Kolkata date

          echo ""
          echo "Topics:"
          cat topics/topics.csv || true

          echo ""
          echo "Videos:"
          ls -lh videos || true

          echo ""
          echo "Scripts:"
          ls -lh scripts || true

          echo ""
          echo "Upload records:"
          ls -lh metadata/uploads || true

          echo "========================================"
